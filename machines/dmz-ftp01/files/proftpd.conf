ServerName                      "ProFTPD 1.3.5 Server"
ServerType                      standalone
DefaultServer                   on
Port                            2121
UseIPv6                         off
ServerIdent                     on "ProFTPD 1.3.5 Server"

User                            www-data
Group                           www-data
RequireValidShell               off
CapabilitiesEngine              off
AllowOverwrite                  on
AllowStoreRestart               on

SystemLog                       /var/log/proftpd-lab.log
ScoreboardFile                  /opt/proftpd-1.3.5/var/proftpd.scoreboard

# mod_copy is compiled into this lab build (CVE-2015-3306)
<Limit SITE_CPFR SITE_CPTO>
  AllowAll
</Limit>
