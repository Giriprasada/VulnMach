<VirtualHost *:80>
    ServerName proftpd-lab.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/proftpd-lab-error.log
    CustomLog ${APACHE_LOG_DIR}/proftpd-lab-access.log combined
</VirtualHost>
