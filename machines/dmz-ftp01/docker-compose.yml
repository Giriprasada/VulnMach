version: '3.8'
# ================================================================
# LEGACY — Docker deploy is NO LONGER the primary path.
# Prefer HOST install:
#   cd machines/dmz-ftp01 && sudo ./deploy.sh
#
# Kept only for reference. Do not run alongside the host
# systemd units (port 21 / 2121 / 80 conflicts).
# ================================================================
services:
  dmz-ftp01:
    build: .
    container_name: vulncorp-ftp01
    hostname: vulncorp-ftp01
    ports:
      - "0.0.0.0:21:21"
      - "0.0.0.0:2121:2121"
      - "0.0.0.0:22:22"
      - "0.0.0.0:80:80"
      - "0.0.0.0:40000-40100:40000-40100"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    environment:
      - VULNCORP_ENV=lab
      - MACHINE_IP=10.10.10.30
