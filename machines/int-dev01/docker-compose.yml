# VulnCorp — Machine 9: int-dev01
# DEPLOY: git clone <repo> && cd int-dev01 && sudo ./deploy.sh
# ACCESS: http://<this host's current IP>/          (GitLab)
#         http://<this host's current IP>:8080      (Jenkins — no auth)
#         curl http://<this host's current IP>:2375/version
# Start with ./up.sh so GitLab follows the DHCP address. Do not write that address into this file.
# ⚠️  FOR EDUCATIONAL / LAB USE ONLY

networks:
  vulncorp-dev:
    driver: bridge

services:

  # ── Main DevOps container: SSH + Docker API exposure ────────────────────────
  int-dev01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulncorp-dev01
    hostname: vulncorp-dev01
    privileged: true
    ports:
      - "0.0.0.0:2375:2375"     # Docker API — NO TLS (vulnerability)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    networks:
      - vulncorp-dev
    environment:
      - VULNCORP_ENV=lab

  # ── GitLab CE 13.10.2 — last 13.10 build before the CVE-2021-22205 fix (13.10.3)
  vulncorp-gitlab:
    image: gitlab/gitlab-ce:13.10.2-ce.0
    container_name: vulncorp-gitlab
    hostname: vulncorp-gitlab
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"         # GitLab HTTP
    environment:
      HOST_IP: ${HOST_IP}
      GITLAB_OMNIBUS_CONFIG: |
        external_url "http://#{ENV['HOST_IP']}"
        gitlab_rails['initial_shared_runners_registration_token'] = 'disabled'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        puma['worker_processes'] = 0
        sidekiq['max_concurrency'] = 5
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_data:/var/opt/gitlab
      - gitlab_logs:/var/log/gitlab
    networks:
      - vulncorp-dev

  # ── Jenkins — Authentication Disabled (Script Console = instant RCE) ────────
  vulncorp-jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: vulncorp-jenkins
    hostname: vulncorp-jenkins
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"     # Jenkins (no auth)
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - vulncorp-dev

volumes:
  gitlab_config:
  gitlab_data:
  gitlab_logs:
  jenkins_home:
